name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudfunctions/oradv/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloudfunctions/oradv --ignore-scripts
      - run: npm run check
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm audit --prefix cloudfunctions/oradv --registry=https://registry.npmjs.org --omit=dev --audit-level=high
